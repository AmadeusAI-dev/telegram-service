name: Run Tests

on: pull_request

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v6
      
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod 
          cache: true

      - name: Download dependencies
        run: time go mod download

      - name: Vet
        run: time go vet ./...

      - name: Test
        run: time go test ./...
